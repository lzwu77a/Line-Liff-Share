<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF 預覽</title>
    <style>
        /* 讓 iframe 填滿整個手機畫面，並隱藏滾動條 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f5f5;
            overflow: hidden; 
        }
        #pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* 載入完成前先隱藏 */
        }
        .loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00B900;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- 載入動畫 -->
    <div class="loader-container" id="loading-screen">
        <div class="loader"></div>
        <div id="statusMessage">讀取檔案中...</div>
    </div>

    <!-- 顯示 PDF 的區塊 -->
    <iframe id="pdf-frame"></iframe>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const myLiffId = "2011190138-2bRTUaO7"; 

        async function main() {
            try {
                await liff.init({ liffId: myLiffId });

                const urlParams = new URLSearchParams(window.location.search);
                const fileId = urlParams.get('file_id');

                if (!fileId) throw new Error("網址缺少 file_id 參數");

                // 注意：這裡結尾必須是 /preview，這是 Google Drive 專門給 iframe 嵌入用的網址
                const pdfUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                
                const iframe = document.getElementById('pdf-frame');
                const loadingScreen = document.getElementById('loading-screen');

                // 當 iframe 載入完成時，隱藏轉圈圈，顯示 PDF
                iframe.onload = function() {
                    loadingScreen.style.display = 'none';
                    iframe.style.display = 'block';
                };

                // 將網址塞給 iframe 開始載入
                iframe.src = pdfUrl;

            } catch (error) {
                document.getElementById('statusMessage').innerText = "發生錯誤：" + error.message;
                document.getElementById('statusMessage').style.color = "red";
                document.querySelector('.loader').style.display = 'none';
            }
        }

        main();
    </script>
</body>
</html>
