<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>分享股票</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
<div id="status">準備分享...</div>
<script>

    const LIFF_ID = '2011190138-2bRTUaO7';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzwLtRdN3SZn8vg1HP-S0kW4tihv7pzw3EHcFZmBEyO/dev?page=liff&gibhub=1';

    async function main() {
        try {

            // 1. 初始化 LIFF
            await liff.init({
               liffId: LIFF_ID
                });

            // 2. 必須登入
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            // 3. 確認目前環境支援 shareTargetPicker
            if (!liff.isApiAvailable('shareTargetPicker')) {
                document.getElementById('status').innerText = '此環境不支援分享功能，請使用 LINE App 開啟。';
                return;
            }
        } catch (error) {
            console.error(error);
            document.getElementById('status').innerText = 'LIFF 初始化失敗：' + error.message;
        }

        const params = new URLSearchParams(window.location.search);
        const shareName = params.get('shareName');

        if (!shareName) {
            document.getElementById('status').innerText = '缺少shareName';
            return;
        }

        const response = await fetch(GAS_URL+'&shareName=123');
        await share();
    }

    async function share() {

        try {

            const result =
                await liff.shareTargetPicker([{
                    type: "text",
                    text: "這是測試訊息"
                }]);

            console.log("share result:", result);

            if (result) {
                // 分享成功
                await sendToGAS(result);

                document.getElementById("status").innerText = "完成";
            } else {
                document.getElementById("status").innerText = "取消分享";
            }
        } catch (error) {
            console.error(error);
            document.getElementById("status").innerText = "分享失敗: " + error.message;
        }
    }


    // 成功接收到後端回傳的 HTML 字串時執行
    function displayContent(data) {
        if ( !data ) {
            console.log("shareName=" + shareName);
            console.log(JSON.stringify(data));
            document.getElementById('table-container').innerHTML = "OK";
            return;
        }
    }

    main();

</script>

</body>
</html>
