<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享訊息</title>
    <!-- 載入 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        #status {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }
        #retryBtn {
            display: none;
            padding: 10px 24px;
            background-color: #00B900;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="status">載入中，請稍候...</div>
    <button id="retryBtn" onclick="shareMessage()">手動重新分享</button>

    <script>
        const LIFF_ID = "2011190138-2bRTUaO7"; 
        const BASE_FETCH_URL = "https://script.google.com/macros/s/AKfycbx78tLvsUbCvEBFbSaOverVMJYf4elS39Ysx-6bSBsF0yxwYoj2EhEa5Kn9uy1cU1COiw/exec?page=gitHub";

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: window.location.href });
                    return;
                }
                
                await shareMessage();
            } catch (error) {
                document.getElementById('status').innerText = "LIFF 初始化失敗，請重新載入網頁。";
                console.error("LIFF Initialization failed", error);
            }
        }

        async function shareMessage() {
            if (!liff.isApiAvailable('shareTargetPicker')) {
                document.getElementById('status').innerText = "您的裝置環境不支援分享功能\n(請確認使用手機版 LINE 打開)";
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');

            if (!targetId) {
                document.getElementById('status').innerText = "無效的連結：缺少必要的參數。";
                return;
            }
            
            document.getElementById('status').innerText = "正在取得訊息，準備分享...";

            try {
                // 組合網址並強制跟隨轉址 (解決 GAS CORS 問題)
                const fetchUrlWithId = `${BASE_FETCH_URL}&id=${targetId}`;
                const response = await fetch(fetchUrlWithId, { redirect: "follow" });
                
                if (!response.ok) {
                    throw new Error(`伺服器錯誤: ${response.status}`);
                }
                
                const flexContents = await response.json(); 

                const messageObj = {
                    type: "flex",
                    altText: "收到一個分享訊息", 
                    contents: flexContents
                };

                const shareResult = await liff.shareTargetPicker([messageObj]);

                if (shareResult) {
                    document.getElementById('status').innerText = "分享成功！";
                    // 分享完畢後自動關閉 LIFF 視窗
                    setTimeout(() => liff.closeWindow(), 1000); 
                } else {
                    document.getElementById('status').innerText = "已取消分享";
                    document.getElementById('retryBtn').style.display = "block";
                }

            } catch (error) {
                document.getElementById('status').style.color = "red";
                document.getElementById('status').innerText = "取得訊息失敗，請稍後再試。";
                document.getElementById('retryBtn').style.display = "block";
                console.error("Share failed", error);
            }
        }

        window.onload = initializeLiff;
    </script>
</body>
</html>
