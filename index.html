<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享訊息</title>
    <!-- 載入 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        #status {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        #retryBtn {
            display: none;
            padding: 10px 24px;
            background-color: #00B900;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="status">載入中，請稍候...</div>
    <button id="retryBtn" onclick="shareMessage()">手動分享</button>

    <script>
        // 替換為你在 LINE Developers console 中取得的 LIFF ID
        const LIFF_ID = "2011190138-2bRTUaO7"; 
        
        // 替換為你要 fetch Flex Message JSON 的 API 網址
        //const FETCH_URL = "https://liff.line.me/2011190138-iTiXj2cS";
        const FETCh_URL = "https://script.google.com/macros/s/AKfycbzwLtRdN3SZn8vg1HP-S0kW4tihv7pzw3EHcFZmBEyO/dev?page=gitHub";

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    // 如果未登入，引導登入
                    liff.login({ redirectUri: window.location.href });
                    return;
                }

                // 登入成功後直接觸發分享流程
                await shareMessage();

            } catch (error) {
                document.getElementById('status').innerText = "LIFF 初始化失敗";
                console.error("LIFF Initialization failed", error);
            }
        }

        async function shareMessage() {
            if (!liff.isApiAvailable('shareTargetPicker')) {
                document.getElementById('status').innerText = "您的環境不支援 Share Target Picker";
                return;
            }

            // 🔍 1. 從網址列取得 id 參數
            // 假設你的 LIFF 網址是 https://liff.line.me/你的LIFF_ID?id=123
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');

            if (!targetId) {
                document.getElementById('status').innerText = "網址缺少 id 參數，無法取得資料";
                return;
            }
            
            document.getElementById('status').innerText = "正在取得訊息...";

            try {

                // 🔗 2. 將 id 附加到 GAS 網址的後面 (變成 ?id=123)
                const fetchUrlWithId = `${BASE_FETCH_URL}?id=${targetId}`;

                // Fetch 取得 Flex Message 資料
                const response = await fetch(fetchUrlWithId);
                if (!response.ok) throw new Error("API 回應錯誤");
                
                // 假設你的 API 直接回傳 flex 的 contents 物件 (bubble 或 carousel)
                const flexContents = await response.json(); 

                // 組裝成 LINE 訊息格式
                const messageObj = {
                    type: "flex",
                    altText: "收到一個分享訊息", // 顯示在聊天列表的替代文字
                    contents: flexContents
                };

                // 2. 喚起 Share Target Picker
                const shareResult = await liff.shareTargetPicker([messageObj]);

                if (shareResult) {
                    // 使用者成功分享
                    document.getElementById('status').innerText = "分享成功！";
                    // 分享完畢後自動關閉 LIFF 視窗
                    setTimeout(() => liff.closeWindow(), 1000); 
                } else {
                    // 使用者取消了分享 (關閉了 Picker 視窗)
                    document.getElementById('status').innerText = "已取消分享";
                    document.getElementById('retryBtn').style.display = "block";
                }

            } catch (error) {
                document.getElementById('status').innerText = "取得訊息或分享失敗";
                document.getElementById('retryBtn').style.display = "block";
                console.error("Share failed", error);
            }
        }

        // 網頁載入後啟動
        window.onload = initializeLiff;
    </script>
</body>
</html>
