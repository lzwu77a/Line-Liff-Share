<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Liff Share V6</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
<div id="status">準備分享...</div>
<script>

    const LIFF_ID = '2011190138-2bRTUaO7';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzwLtRdN3SZn8vg1HP-S0kW4tihv7pzw3EHcFZmBEyO/dev?page=liff&gibhub=1';

    const params = new URLSearchParams(window.location.search);
    const shareName = params.get('shareName');

    async function main() {
        try {
            // 1. 初始化 LIFF
            await liff.init({
               liffId: LIFF_ID
                });

            // 2. 必須登入
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            // 3. 確認目前環境支援 shareTargetPicker
            if (!liff.isApiAvailable('shareTargetPicker')) {
                document.getElementById('status').innerText = '此環境不支援分享功能，請使用 LINE App 開啟。';
                return;
            }
        } catch (error) {
            console.error(error);
            document.getElementById('status').innerText = 'LIFF 初始化失敗：' + error.message;
        }
        
        if (!shareName) {
            document.getElementById('status').innerText = '缺少shareName';
            return;
        }

        //const response = await fetch(GAS_URL+'&shareName=123');
        await share();
    }

    async function share() {
        try {
            const result =
                await liff.shareTargetPicker([{
                    type: "text",
                    text: "這是測試訊息"
                }]);

            console.log("share result:", result);

            if (result) {
                // 分享成功
                var gasReturn = await sendToGAS(shareName);

                document.getElementById("status").innerText = gasReturn;
            } else {
                document.getElementById("status").innerText = "取消分享";
                liff.closeWindow();
            }
        } catch (error) {
            console.error(error);
            document.getElementById("status").innerText = "分享失敗: " + error.message;
        }
    }


    // 成功接收到後端回傳的 HTML 字串時執行
    function displayContent(data) {
        if ( !data ) {
            console.log("shareName=" + shareName);
            console.log(JSON.stringify(data));
            document.getElementById('status').innerHTML = "OK";
            return;
        }
    }

    async function sendToGAS(shareName) {
        const url = GAS_URL + "&shareName=" + shareName;
        try {

            const response = await fetch(url);
            const text = await response.text();

            console.log(
                "GAS:",
                text
            );
            return text;
        } catch (error) {
            console.error(
                "GAS fetch failed:",
                error
            );
            return "Error on sendToGas: " + error;
        }
    }

    main();

</script>

</body>
</html>
