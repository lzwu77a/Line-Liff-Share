<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享訊息</title>
    <!-- 載入 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        #status {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        #retryBtn {
            display: none;
            padding: 10px 24px;
            background-color: #00B900;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="status">載入中，請稍候...</div>
    <button id="retryBtn" onclick="shareMessage()">手動分享</button>

    <script>

const LIFF_ID = "2011190138-2bRTUaO7"; 
const BASE_FETCH_URL = "https://script.google.com/macros/s/AKfycbzwLtRdN3SZn8vg1HP-S0kW4tihv7pzw3EHcFZmBEyO/exec?page=gitHub";

async function initializeLiff() {
    try {
        // 第一個檢查點
        alert("1. 準備初始化 LIFF");
        await liff.init({ liffId: LIFF_ID });
        
        if (!liff.isLoggedIn()) {
            alert("未登入，準備導向登入");
            liff.login({ redirectUri: window.location.href });
            return;
        }

        alert("2. LIFF 初始化成功，準備分享");
        await shareMessage();

    } catch (error) {
        alert("❌ LIFF 初始化失敗: " + error.message);
    }
}

async function shareMessage() {
    try {
        if (!liff.isApiAvailable('shareTargetPicker')) {
            alert("❌ 環境不支援 (請確認是用手機版 LINE 打開，不是電腦版)");
            return;
        }

        // 檢查網址參數
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        if (!targetId) {
            // 如果跑到這裡，代表參數不見了！
            alert("❌ 抓不到 id！目前的網址是: " + window.location.href);
            return;
        }
        
        alert("3. 成功抓到 ID: " + targetId);

        // 組合網址並設定強制轉址
        const fetchUrlWithId = `${BASE_FETCH_URL}&id=${targetId}`;
        alert("4. 準備 Fetch: " + fetchUrlWithId);

        const response = await fetch(fetchUrlWithId, { redirect: "follow" });
        if (!response.ok) {
            throw new Error(`伺服器錯誤: ${response.status}`);
        }
        
        const responseText = await response.text();
        alert("5. 成功收到 GAS 回應，前 30 個字為: " + responseText.substring(0, 30));

        const flexContents = JSON.parse(responseText); 

        const messageObj = {
            type: "flex",
            altText: "收到一個分享訊息", 
            contents: flexContents
        };

        alert("6. 準備打開分享好友清單");
        const shareResult = await liff.shareTargetPicker([messageObj]);

        if (shareResult) {
            alert("🎉 分享成功！");
            liff.closeWindow(); 
        } else {
            alert("使用者取消分享");
        }

    } catch (error) {
        alert("❌ 發生嚴重錯誤: " + error.message);
    }
}

window.onload = initializeLiff;
    </script>
</body>
</html>
